<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.156.0/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skinview3d@3.2.0/bundles/skinview3d.bundle.js"></script>
  <style>
    :root {
      --bg-canvas: #0c0d10;
      --bg-panel: #13151a;
      --bg-elevated: #1a1d24;
      --bg-card: #151821;
      --bg-card-hover: #1b202c;
      --bg-input: #0e1014;
      --border-subtle: #21252f;
      --border-strong: #323746;
      --border-namemc: #252a38;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-namemc: #5c8ae6;
      --text-main: #f1f3f7;
      --text-muted: #7e8696;
      --danger: #dc2626;
      --star-gold: #fbbf24;
      --star-dim: #64748b;
      --radius: 4px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      font-size: 12px;
      background-color: var(--bg-canvas);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    header {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 10;
    }

    .brand {
      font-weight: 600;
      font-size: 0.85rem;
      letter-spacing: 0.02em;
      white-space: nowrap;
    }

    .search-group {
      display: flex;
      align-items: center;
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      max-width: 280px;
      width: 100%;
      height: 26px;
    }

    .search-group input {
      background: transparent;
      border: none;
      color: #fff;
      padding: 0 8px;
      font-size: 0.75rem;
      outline: none;
      width: 100%;
      user-select: text;
    }

    .search-group button {
      background: var(--bg-elevated);
      border: none;
      border-left: 1px solid var(--border-subtle);
      color: var(--text-muted);
      height: 100%;
      padding: 0 10px;
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 500;
    }

    .search-group button:hover {
      background: var(--border-strong);
      color: #fff;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border-subtle);
      height: 26px;
      padding: 0 10px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.72rem;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-decoration: none;
      transition: background 0.1s, border-color 0.1s;
      white-space: nowrap;
    }

    .btn:hover {
      background: #252a35;
      border-color: var(--border-strong);
    }

    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
      border-color: var(--accent-hover);
    }

    .workspace {
      display: flex;
      flex: 1;
      height: calc(100vh - 40px);
      overflow: hidden;
    }

    .sidebar-left {
      width: 220px;
      background: var(--bg-panel);
      border-right: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 10px;
      gap: 12px;
    }

    .panel-box {
      background: var(--bg-canvas);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius);
      padding: 8px;
    }

    .panel-title {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    .tools-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
    }

    .tool-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      height: 28px;
      border-radius: var(--radius);
      cursor: pointer;
      font-size: 0.7rem;
      font-weight: 500;
    }

    .tool-btn:hover {
      background: #232731;
      color: #fff;
    }

    .tool-btn.active {
      background: #1e283d;
      border-color: var(--accent);
      color: #fff;
    }

    .color-preview-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .color-swatch-large {
      width: 32px;
      height: 32px;
      border-radius: var(--radius);
      border: 1px solid var(--border-strong);
      position: relative;
    }

    .color-swatch-large input[type="color"] {
      position: absolute;
      opacity: 0;
      width: 100%;
      height: 100%;
      cursor: pointer;
    }

    .color-hex {
      background: var(--bg-input);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 4px 6px;
      border-radius: var(--radius);
      font-family: monospace;
      font-size: 0.75rem;
      outline: none;
      width: 100%;
      user-select: text;
    }

    .palette-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }

    .palette-chip {
      width: 100%;
      aspect-ratio: 1;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .popular-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
    }

    .tag-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 3px 6px;
      border-radius: var(--radius);
      font-size: 0.68rem;
      cursor: pointer;
    }

    .tag-btn:hover {
      color: #fff;
      border-color: var(--border-strong);
    }

    .editor-center {
      flex: 1;
      display: flex;
      flex-direction: column;
      background: #090a0d;
      position: relative;
      overflow: hidden;
    }

    .editor-toolbar {
      background: var(--bg-panel);
      border-bottom: 1px solid var(--border-subtle);
      height: 32px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .canvas-viewport {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: #0d0f14;
      padding: 20px;
    }

    .canvas-stack {
      position: relative;
      border: 1px solid var(--border-strong);
      background-image: 
        linear-gradient(45deg, #13161c 25%, transparent 25%), 
        linear-gradient(-45deg, #13161c 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, #13161c 75%), 
        linear-gradient(-45deg, transparent 75%, #13161c 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
      background-color: #0b0c0f;
      cursor: crosshair;
    }

    #mainCanvas {
      image-rendering: pixelated;
      display: block;
    }

    #overlayCanvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .status-bar {
      background: var(--bg-panel);
      border-top: 1px solid var(--border-subtle);
      height: 22px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.7rem;
      color: var(--text-muted);
      font-family: monospace;
    }

    .sidebar-right {
      width: 260px;
      background: var(--bg-panel);
      border-left: 1px solid var(--border-subtle);
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 10px;
      overflow-y: auto;
    }

    #skin3d-wrapper {
      width: 100%;
      height: 280px;
      background: #090a0d;
      border-radius: var(--radius);
      border: 1px solid var(--border-subtle);
      position: relative;
    }

    #skin3d-canvas {
      width: 100%;
      height: 100%;
      outline: none;
    }

    .view-angles {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 3px;
    }

    .select-styled {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: #fff;
      padding: 3px 6px;
      border-radius: var(--radius);
      font-size: 0.72rem;
      outline: none;
      width: 100%;
      cursor: pointer;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      font-size: 0.72rem;
      color: var(--text-main);
    }

    /* Modal Layouts */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 16px;
    }

    .modal-backdrop.active {
      display: flex;
    }

    .popup-window {
      width: 95vw;
      max-width: 1200px;
      height: 88vh;
      background: var(--bg-panel);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .popup-header {
      background: var(--bg-panel);
      padding: 0 12px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-subtle);
    }

    .popup-body {
      display: flex;
      flex: 1;
      overflow: hidden;
      position: relative;
    }

    .popup-3d-viewport {
      flex: 1;
      height: 100%;
      position: relative;
      background: #08090b;
    }

    #popup3d-canvas {
      width: 100%;
      height: 100%;
      display: block;
      cursor: crosshair;
    }

    .popup-tools-floating {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(19, 21, 26, 0.95);
      border: 1px solid var(--border-strong);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 200px;
      z-index: 20;
    }

    .popup-limbs-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 3px;
    }

    .limb-toggle-btn {
      background: var(--bg-elevated);
      border: 1px solid var(--border-subtle);
      color: var(--text-muted);
      padding: 4px 0;
      border-radius: var(--radius);
      font-size: 0.68rem;
      cursor: pointer;
      text-align: center;
    }

    .limb-toggle-btn.active {
      background: #1e283d;
      border-color: var(--accent);
      color: #fff;
    }

    .popup-hud-info {
      position: absolute;
      bottom: 10px;
      left: 10px;
      background: rgba(19, 21, 26, 0.92);
      border: 1px solid var(--border-subtle);
      padding: 6px 10px;
      border-radius: var(--radius);
      font-family: monospace;
      font-size: 0.7rem;
      color: var(--text-muted);
      pointer-events: none;
      z-index: 20;
    }

    /* Native NameMC Browser Modal Styling */
    .browser-toolbar {
      background: #101217;
      border-bottom: 1px solid var(--border-subtle);
      padding: 6px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-shrink: 0;
    }

    .browser-grid-view {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      background: #090a0d;
    }

    .namemc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(136px, 1fr));
      gap: 12px;
      max-width: 1300px;
      margin: 0 auto;
    }

    .mc-card {
      background: var(--bg-card);
      border: 1px solid var(--border-namemc);
      border-radius: var(--radius);
      padding: 8px 10px;
      display: flex;
      flex-direction: column;
      position: relative;
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease;
      min-height: 240px;
    }

    .mc-card:hover {
      transform: translateY(-3px);
      border-color: #3b82f6;
      background: var(--bg-card-hover);
    }

    .mc-card-header {
      width: 100%;
      text-align: center;
      margin-bottom: 2px;
    }

    .mc-username {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--accent-namemc);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: inline-block;
      max-width: 100%;
    }

    .mc-rank {
      font-size: 0.68rem;
      color: #64748b;
      font-family: monospace;
      text-align: left;
      width: 100%;
      font-weight: 600;
    }

    .mc-render-box {
      flex: 1;
      width: 100%;
      min-height: 160px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 4px;
      background-image: 
        linear-gradient(45deg, rgba(255, 255, 255, 0.025) 25%, transparent 25%), 
        linear-gradient(-45deg, rgba(255, 255, 255, 0.025) 25%, transparent 25%), 
        linear-gradient(45deg, transparent 75%, rgba(255, 255, 255, 0.025) 75%), 
        linear-gradient(-45deg, transparent 75%, rgba(255, 255, 255, 0.025) 75%);
      background-size: 14px 14px;
      background-position: 0 0, 0 7px, 7px -7px, -7px 0px;
    }

    .mc-render-box img {
      max-height: 150px;
      width: auto;
      object-fit: contain;
      image-rendering: pixelated;
      filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.5));
    }

    .mc-card-overlay {
      position: absolute;
      inset: 0;
      background: rgba(10, 12, 16, 0.86);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.15s ease;
      border-radius: var(--radius);
    }

    .mc-card:hover .mc-card-overlay {
      opacity: 1;
      pointer-events: auto;
    }

    .mc-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-top: 6px;
      font-size: 0.68rem;
    }

    .star-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--star-dim);
      padding: 2px 6px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 3px;
      font-size: 0.68rem;
    }

    .star-btn:hover, .star-btn.is-starred {
      color: var(--star-gold);
      background: rgba(251, 191, 36, 0.12);
      border-color: rgba(251, 191, 36, 0.3);
    }

    .toast {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border-strong);
      padding: 8px 12px;
      border-radius: var(--radius);
      font-size: 0.75rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.15s, transform 0.15s;
      pointer-events: none;
      z-index: 200;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">Skin Studio</div>

    <div class="search-group">
      <input type="text" id="playerSearchInput" placeholder="Find player skin..." autocomplete="off" spellcheck="false" />
      <button id="searchSkinBtn">Search</button>
    </div>

    <div class="top-actions">
      <!-- NATIVE BROWSE SKINS BUTTON -->
      <button class="btn btn-primary" id="openSkinBrowserBtn">🔍 Browse Skins</button>
      <button class="btn" id="open3dPopupBtn">3D Painter</button>
      <a href="poses.html" class="btn" id="openPosePageBtn">Poses &gt;</a>
      <input type="file" id="fileInput" accept="image/png" style="display:none;" />
      <button class="btn" id="uploadSkinBtn">Upload</button>
      <button class="btn" id="downloadSkinBtn">Download .png</button>
    </div>
  </header>

  <div class="workspace">
    <aside class="sidebar-left">
      <div class="panel-box">
        <div class="panel-title">Tools</div>
        <div class="tools-grid">
          <button class="tool-btn active" data-tool="pencil">Pencil (B)</button>
          <button class="tool-btn" data-tool="eraser">Eraser (E)</button>
          <button class="tool-btn" data-tool="bucket">Bucket (G)</button>
          <button class="tool-btn" data-tool="dropper">Picker (I)</button>
          <button class="tool-btn" data-tool="noise">Shade (N)</button>
          <button class="tool-btn" data-tool="lighten">Light (L)</button>
        </div>
      </div>

      <div class="panel-box">
        <div class="panel-title">Color</div>
        <div class="color-preview-row">
          <div class="color-swatch-large" id="currentColorSwatch" style="background-color: #bb8361;">
            <input type="color" id="nativeColorPicker" value="#bb8361">
          </div>
          <input type="text" id="hexColorInput" class="color-hex" value="#BB8361" maxlength="7">
        </div>

        <div class="panel-title" style="margin-top: 8px;">Palette</div>
        <div class="palette-grid" id="presetPalette"></div>

        <div class="panel-title" style="margin-top: 8px;">Recent</div>
        <div class="palette-grid" id="recentPalette"></div>
      </div>

      <div class="panel-box">
        <div class="panel-title">Presets</div>
        <div class="popular-tags">
          <button class="tag-btn" data-player="Notch">Notch</button>
          <button class="tag-btn" data-player="Jeb_">Jeb_</button>
          <button class="tag-btn" data-player="Dream">Dream</button>
          <button class="tag-btn" data-player="Technoblade">Technoblade</button>
          <button class="tag-btn" data-player="Mumbo">Mumbo</button>
        </div>
      </div>
    </aside>

    <main class="editor-center">
      <div class="editor-toolbar">
        <div class="toolbar-group">
          <button class="btn" id="undoBtn" disabled>Undo</button>
          <button class="btn" id="redoBtn" disabled>Redo</button>
          <button class="btn" id="clearCanvasBtn">Clear</button>
        </div>

        <div class="toolbar-group">
          <label class="toggle-label">
            <input type="checkbox" id="toggleGrid" checked> Grid
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="toggleUVGuide" checked> UV
          </label>
          <select class="select-styled" id="layerFilterSelect" style="width: 100px;">
            <option value="all">All Layers</option>
            <option value="base">Base Layer</option>
            <option value="overlay">Overlay</option>
          </select>
        </div>

        <div class="toolbar-group">
          <button class="btn" id="zoomOutBtn">-</button>
          <span id="zoomLevelText" style="font-family: monospace; min-width: 36px; text-align: center;">800%</span>
          <button class="btn" id="zoomInBtn">+</button>
        </div>
      </div>

      <div class="canvas-viewport" id="canvasViewport">
        <div class="canvas-stack" id="canvasStack">
          <canvas id="mainCanvas" width="64" height="64"></canvas>
          <canvas id="overlayCanvas" width="512" height="512"></canvas>
        </div>
      </div>

      <div class="status-bar">
        <div id="coordStatus">X: --, Y: --</div>
        <div id="partStatus">Idle</div>
        <div id="colorStatus">HEX: --</div>
      </div>
    </main>

    <aside class="sidebar-right">
      <div class="panel-title" style="display:flex; justify-content:space-between;">
        <span>3D Preview</span>
        <span style="color:var(--text-muted);">Sync Active</span>
      </div>

      <div id="skin3d-wrapper">
        <canvas id="skin3d-canvas"></canvas>
      </div>

      <div class="panel-box">
        <div class="panel-title">Camera</div>
        <div class="view-angles">
          <button class="btn" data-angle="front">Front</button>
          <button class="btn" data-angle="back">Back</button>
          <button class="btn" data-angle="left">Left</button>
          <button class="btn" data-angle="iso">Iso</button>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 6px;">
          <div>
            <div style="color: var(--text-muted); font-size: 0.65rem; margin-bottom: 2px;">Motion</div>
            <select class="select-styled" id="animSelect">
              <option value="walk" selected>Walk</option>
              <option value="idle">Idle</option>
              <option value="run">Run</option>
              <option value="none">Static</option>
            </select>
          </div>
          <div>
            <div style="color: var(--text-muted); font-size: 0.65rem; margin-bottom: 2px;">Model</div>
            <select class="select-styled" id="modelShapeSelect">
              <option value="default" selected>Steve (4px)</option>
              <option value="slim">Alex (3px)</option>
            </select>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; margin-top: 8px;">
          <label class="toggle-label">
            <input type="checkbox" id="autoRotateToggle"> Rotate
          </label>
          <label class="toggle-label">
            <input type="checkbox" id="outerLayerToggle" checked> Overlay
          </label>
        </div>
      </div>
    </aside>
  </div>

  <!-- 3D PAINTER MODAL -->
  <div class="modal-backdrop" id="popup3dModal">
    <div class="popup-window">
      <div class="popup-header">
        <span style="font-weight:600; color:#fff;">3D Mesh Painter</span>
        <div style="display:flex; align-items:center; gap:6px;">
          <button class="btn btn-primary" id="saveAndClosePopupBtn">Done</button>

  <div class="toast" id="toast">Notification</div>

  <script>
    const state = {
      tool: 'pencil',
      color: '#bb8361',
      zoom: 8,
      isDrawing: false,
      lastX: -1,
      lastY: -1,
      showGrid: true,
      showUVGuide: true,
      layerFilter: 'all',
      history: [],
      historyIndex: -1,
      recentColors: ['#bb8361', '#452b1b', '#00a8a8', '#2c3577', '#ffffff', '#000000'],
      isTPose: false
    };

    const SKIN_PARTS = [
      { name: 'Head Top', layer: 'base', x: 8, y: 0, w: 8, h: 8, color: '#38bdf8' },
      { name: 'Head Bottom', layer: 'base', x: 16, y: 0, w: 8, h: 8, color: '#38bdf8' },
      { name: 'Head Right', layer: 'base', x: 0, y: 8, w: 8, h: 8, color: '#38bdf8' },
      { name: 'Head Front', layer: 'base', x: 8, y: 8, w: 8, h: 8, color: '#38bdf8' },
      { name: 'Head Left', layer: 'base', x: 16, y: 8, w: 8, h: 8, color: '#38bdf8' },
      { name: 'Head Back', layer: 'base', x: 24, y: 8, w: 8, h: 8, color: '#38bdf8' },
      { name: 'Hat Top', layer: 'overlay', x: 40, y: 0, w: 8, h: 8, color: '#818cf8' },
      { name: 'Hat Bottom', layer: 'overlay', x: 48, y: 0, w: 8, h: 8, color: '#818cf8' },
      { name: 'Hat Right', layer: 'overlay', x: 32, y: 8, w: 8, h: 8, color: '#818cf8' },
      { name: 'Hat Front', layer: 'overlay', x: 40, y: 8, w: 8, h: 8, color: '#818cf8' },
      { name: 'Hat Left', layer: 'overlay', x: 48, y: 8, w: 8, h: 8, color: '#818cf8' },
      { name: 'Hat Back', layer: 'overlay', x: 56, y: 8, w: 8, h: 8, color: '#818cf8' },
      { name: 'Torso Top', layer: 'base', x: 20, y: 16, w: 8, h: 4, color: '#4ade80' },
      { name: 'Torso Bottom', layer: 'base', x: 28, y: 16, w: 8, h: 4, color: '#4ade80' },
      { name: 'Torso Right', layer: 'base', x: 16, y: 20, w: 4, h: 12, color: '#4ade80' },
      { name: 'Torso Front', layer: 'base', x: 20, y: 20, w: 8, h: 12, color: '#4ade80' },
      { name: 'Torso Left', layer: 'base', x: 28, y: 20, w: 4, h: 12, color: '#4ade80' },
      { name: 'Torso Back', layer: 'base', x: 32, y: 20, w: 8, h: 12, color: '#4ade80' },
      { name: 'Jacket Top', layer: 'overlay', x: 20, y: 32, w: 8, h: 4, color: '#34d399' },
      { name: 'Jacket Bottom', layer: 'overlay', x: 28, y: 32, w: 8, h: 4, color: '#34d399' },
      { name: 'Jacket Right', layer: 'overlay', x: 16, y: 36, w: 4, h: 12, color: '#34d399' },
      { name: 'Jacket Front', layer: 'overlay', x: 20, y: 36, w: 8, h: 12, color: '#34d399' },
      { name: 'Jacket Left', layer: 'overlay', x: 28, y: 36, w: 4, h: 12, color: '#34d399' },
      { name: 'Jacket Back', layer: 'overlay', x: 32, y: 36, w: 8, h: 12, color: '#34d399' },
      { name: 'R Arm Base', layer: 'base', x: 40, y: 16, w: 16, h: 16, color: '#facc15' },
      { name: 'R Arm Sleeve', layer: 'overlay', x: 40, y: 32, w: 16, h: 16, color: '#eab308' },
      { name: 'L Arm Base', layer: 'base', x: 32, y: 48, w: 16, h: 16, color: '#c084fc' },
      { name: 'L Arm Sleeve', layer: 'overlay', x: 48, y: 48, w: 16, h: 16, color: '#a855f7' },
      { name: 'R Leg Base', layer: 'base', x: 0, y: 16, w: 16, h: 16, color: '#fb923c' },
      { name: 'R Leg Pants', layer: 'overlay', x: 0, y: 32, w: 16, h: 16, color: '#f97316' },
      { name: 'L Leg Base', layer: 'base', x: 16, y: 48, w: 16, h: 16, color: '#f472b6' },
      { name: 'L Leg Pants', layer: 'overlay', x: 0, y: 48, w: 16, h: 16, color: '#ec4899' }
    ];

    const mainCanvas = document.getElementById('mainCanvas');
    const mainCtx = mainCanvas.getContext('2d', { willReadFrequently: true });
    const overlayCanvas = document.getElementById('overlayCanvas');
    const overlayCtx = overlayCanvas.getContext('2d');
    const canvasStack = document.getElementById('canvasStack');
    let skinViewer = null;
    let hoveredPixel = { x: -1, y: -1 };

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2400);
    }

    function hexToRgb(hex) {
      hex = hex.replace('#', '');
      if (hex.length === 3) hex = hex.split('').map(c => c + c).join('');
      const num = parseInt(hex, 16);
      return { r: (num >> 16) & 255, g: (num >> 8) & 255, b: num & 255 };
    }

    function rgbToHex(r, g, b) {
      return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function syncToLocalStorage() {
      try {
        localStorage.setItem('minecraft_active_skin', mainCanvas.toDataURL('image/png'));
      } catch (e) {}
    }

    document.getElementById('openPosePageBtn').onclick = () => syncToLocalStorage();

    function setZoom(newZoom) {
      state.zoom = Math.max(4, Math.min(18, newZoom));
      const size = 64 * state.zoom;
      mainCanvas.style.width = size + 'px';
      mainCanvas.style.height = size + 'px';
      overlayCanvas.width = size;
      overlayCanvas.height = size;
      overlayCanvas.style.width = size + 'px';
      overlayCanvas.style.height = size + 'px';
      canvasStack.style.width = size + 'px';
      canvasStack.style.height = size + 'px';
      document.getElementById('zoomLevelText').textContent = (state.zoom * 100) + '%';
      drawOverlay();
    }

    function fillRect(x, y, w, h, color) {
      mainCtx.fillStyle = color;
      mainCtx.fillRect(x, y, w, h);
    }

    function initSteveBase() {
      mainCtx.clearRect(0, 0, 64, 64);
      fillRect(0, 0, 32, 16, '#452b1b');
      fillRect(8, 8, 8, 8, '#bb8361');
      fillRect(8, 8, 8, 2, '#452b1b');
      fillRect(9, 10, 1, 1, '#452b1b');
      fillRect(14, 10, 1, 1, '#452b1b');
      fillRect(10, 12, 1, 1, '#fff');
      fillRect(11, 12, 1, 1, '#2e389e');
      fillRect(13, 12, 1, 1, '#2e389e');
      fillRect(14, 12, 1, 1, '#fff');
      fillRect(11, 13, 2, 1, '#9c684a');
      fillRect(10, 14, 4, 1, '#472619');
      fillRect(16, 16, 24, 16, '#00a8a8');
      fillRect(20, 20, 8, 2, '#bb8361');
      fillRect(40, 16, 16, 4, '#00a8a8');
      fillRect(40, 20, 16, 12, '#bb8361');
      fillRect(32, 48, 16, 4, '#00a8a8');
      fillRect(32, 52, 16, 12, '#bb8361');
      fillRect(0, 16, 16, 12, '#2c3577');
      fillRect(0, 28, 16, 4, '#424242');
      fillRect(16, 48, 16, 12, '#2c3577');
      fillRect(16, 60, 16, 4, '#424242');
      saveHistoryState();
      sync3D(true);
      drawOverlay();
    }

    function isCoordInActiveLayer(x, y) {
      if (state.layerFilter === 'all') return true;
      const part = SKIN_PARTS.find(p => x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h);
      if (!part) return true;
      return part.layer === state.layerFilter;
    }

    function applyPixel(x, y) {
      if (x < 0 || x >= 64 || y < 0 || y >= 64) return;
      if (!isCoordInActiveLayer(x, y)) return;

      if (state.tool === 'pencil') {
        mainCtx.clearRect(x, y, 1, 1);
        mainCtx.fillStyle = state.color;
        mainCtx.fillRect(x, y, 1, 1);
      } else if (state.tool === 'eraser') {
        mainCtx.clearRect(x, y, 1, 1);
      } else if (state.tool === 'noise') {
        const rgb = hexToRgb(state.color);
        const delta = Math.floor((Math.random() - 0.5) * 36);
        const r = Math.min(255, Math.max(0, rgb.r + delta));
        const g = Math.min(255, Math.max(0, rgb.g + delta));
        const b = Math.min(255, Math.max(0, rgb.b + delta));
        mainCtx.clearRect(x, y, 1, 1);
        mainCtx.fillStyle = `rgb(${r},${g},${b})`;
        mainCtx.fillRect(x, y, 1, 1);
      } else if (state.tool === 'lighten') {
        const p = mainCtx.getImageData(x, y, 1, 1).data;
        if (p[3] === 0) return;
        const r = Math.min(255, p[0] + 16);
        const g = Math.min(255, p[1] + 16);
        const b = Math.min(255, p[2] + 16);
        mainCtx.clearRect(x, y, 1, 1);
        mainCtx.fillStyle = `rgba(${r},${g},${b},${p[3]/255})`;
        mainCtx.fillRect(x, y, 1, 1);
      }
    }

    function drawLine(x0, y0, x1, y1) {
      const dx = Math.abs(x1 - x0);
      const dy = Math.abs(y1 - y0);
      const sx = (x0 < x1) ? 1 : -1;
      const sy = (y0 < y1) ? 1 : -1;
      let err = dx - dy;
      while (true) {
        applyPixel(x0, y0);
        if (x0 === x1 && y0 === y1) break;
        const e2 = 2 * err;
        if (e2 > -dy) { err -= dy; x0 += sx; }
        if (e2 < dx) { err += dx; y0 += sy; }
      }
    }

    function floodFill(startX, startY, fillHex) {
      if (!isCoordInActiveLayer(startX, startY)) return;

      const imgData = mainCtx.getImageData(0, 0, 64, 64);
      const data = imgData.data;
      const targetIdx = (startY * 64 + startX) * 4;
      const targetR = data[targetIdx];
      const targetG = data[targetIdx + 1];
      const targetB = data[targetIdx + 2];
      const targetA = data[targetIdx + 3];

      const fillRgb = hexToRgb(fillHex);
      if (targetA === 255 && targetR === fillRgb.r && targetG === fillRgb.g && targetB === fillRgb.b) return;

      const queue = [[startX, startY]];
      const visited = new Uint8Array(64 * 64);
      visited[startY * 64 + startX] = 1;

      while (queue.length > 0) {
        const [cx, cy] = queue.pop();
        const idx = (cy * 64 + cx) * 4;
        data[idx] = fillRgb.r;
        data[idx + 1] = fillRgb.g;
        data[idx + 2] = fillRgb.b;
        data[idx + 3] = 255;

        const neighbors = [[cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]];
        for (const [nx, ny] of neighbors) {
          if (nx >= 0 && nx < 64 && ny >= 0 && ny < 64 && isCoordInActiveLayer(nx, ny)) {
            const nPos = ny * 64 + nx;
            if (!visited[nPos]) {
              visited[nPos] = 1;
              const nIdx = nPos * 4;
              const match = targetA === 0 
                ? (data[nIdx + 3] === 0)
                : (data[nIdx] === targetR && data[nIdx + 1] === targetG && data[nIdx + 2] === targetB && data[nIdx + 3] === targetA);
              if (match) queue.push([nx, ny]);
            }
          }
        }
      }
      mainCtx.putImageData(imgData, 0, 0);
      saveHistoryState();
      sync3D(true);
      drawOverlay();
    }

    function drawOverlay() {
      const w = overlayCanvas.width;
      const h = overlayCanvas.height;
      const scale = state.zoom;
      overlayCtx.clearRect(0, 0, w, h);

      if (state.layerFilter !== 'all') {
        overlayCtx.fillStyle = 'rgba(0, 0, 0, 0.7)';
        overlayCtx.fillRect(0, 0, w, h);
        SKIN_PARTS.filter(p => p.layer === state.layerFilter).forEach(part => {
          overlayCtx.clearRect(part.x * scale, part.y * scale, part.w * scale, part.h * scale);
        });
      }

      if (state.showGrid) {
        overlayCtx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
        overlayCtx.lineWidth = 1;
        overlayCtx.beginPath();
        for (let i = 0; i <= 64; i++) {
          overlayCtx.moveTo(i * scale, 0);
          overlayCtx.lineTo(i * scale, h);
          overlayCtx.moveTo(0, i * scale);
          overlayCtx.lineTo(w, i * scale);
        }
        overlayCtx.stroke();
      }

      if (state.showUVGuide) {
        SKIN_PARTS.forEach(part => {
          if (state.layerFilter !== 'all' && part.layer !== state.layerFilter) return;
          overlayCtx.strokeStyle = part.color;
          overlayCtx.lineWidth = 1;
          overlayCtx.strokeRect(part.x * scale + 0.5, part.y * scale + 0.5, part.w * scale - 1, part.h * scale - 1);
        });
      }

      if (hoveredPixel.x >= 0 && hoveredPixel.x < 64 && hoveredPixel.y >= 0 && hoveredPixel.y < 64) {
        overlayCtx.strokeStyle = '#ffffff';
        overlayCtx.lineWidth = 1.5;
        overlayCtx.strokeRect(hoveredPixel.x * scale, hoveredPixel.y * scale, scale, scale);
      }
    }

    function getCanvasCoords(e) {
      const rect = mainCanvas.getBoundingClientRect();
      if (e.clientX < rect.left || e.clientX >= rect.right || e.clientY < rect.top || e.clientY >= rect.bottom) {
        return null;
      }
      const x = Math.floor((e.clientX - rect.left) / (rect.width / 64));
      const y = Math.floor((e.clientY - rect.top) / (rect.height / 64));
      return { x: Math.max(0, Math.min(63, x)), y: Math.max(0, Math.min(63, y)) };
    }

    canvasStack.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return;
      const coords = getCanvasCoords(e);
      if (!coords) return;
      const { x, y } = coords;
      state.isDrawing = true;
      state.lastX = x;
      state.lastY = y;

      if (state.tool === 'dropper') {
        const p = mainCtx.getImageData(x, y, 1, 1).data;
        if (p[3] > 0) {
          setColor(rgbToHex(p[0], p[1], p[2]));
          setTool('pencil');
        }
      } else if (state.tool === 'bucket') {
        floodFill(x, y, state.color);
      } else {
        applyPixel(x, y);
        sync3D(false);
      }
      drawOverlay();
    });

    window.addEventListener('mousemove', (e) => {
      const coords = getCanvasCoords(e);
      if (!coords) {
        hoveredPixel = { x: -1, y: -1 };
        document.getElementById('coordStatus').textContent = 'X: --, Y: --';
        document.getElementById('partStatus').textContent = 'Idle';
        document.getElementById('colorStatus').textContent = 'HEX: --';
        drawOverlay();
        return;
      }

      const { x, y } = coords;
      hoveredPixel = { x, y };
      document.getElementById('coordStatus').textContent = `X: ${x}, Y: ${y}`;
      const part = SKIN_PARTS.find(p => x >= p.x && x < p.x + p.w && y >= p.y && y < p.y + p.h);
      document.getElementById('partStatus').textContent = part ? `${part.name}` : 'Transparent';

      const p = mainCtx.getImageData(x, y, 1, 1).data;
      document.getElementById('colorStatus').textContent = p[3] > 0 ? `${rgbToHex(p[0], p[1], p[2])}` : 'None';

      if (state.isDrawing) {
        drawLine(state.lastX, state.lastY, x, y);
        state.lastX = x;
        state.lastY = y;
        sync3D(false);
      }
      drawOverlay();
    });

    window.addEventListener('mouseup', () => {
      if (state.isDrawing) {
        state.isDrawing = false;
        state.lastX = -1;
        state.lastY = -1;
        saveHistoryState();
        sync3D(true);
        syncToLocalStorage();
      }
    });

    function saveHistoryState() {
      state.history = state.history.slice(0, state.historyIndex + 1);
      state.history.push(mainCtx.getImageData(0, 0, 64, 64));
      if (state.history.length > 30) state.history.shift();
      state.historyIndex = state.history.length - 1;
      document.getElementById('undoBtn').disabled = state.historyIndex <= 0;
      document.getElementById('redoBtn').disabled = state.historyIndex >= state.history.length - 1;
    }

    document.getElementById('undoBtn').onclick = () => {
      if (state.historyIndex > 0) {
        state.historyIndex--;
        mainCtx.putImageData(state.history[state.historyIndex], 0, 0);
        document.getElementById('undoBtn').disabled = state.historyIndex <= 0;
        document.getElementById('redoBtn').disabled = state.historyIndex >= state.history.length - 1;
        sync3D(true);
        drawOverlay();
        syncToLocalStorage();
      }
    };

    document.getElementById('redoBtn').onclick = () => {
      if (state.historyIndex < state.history.length - 1) {
        state.historyIndex++;
        mainCtx.putImageData(state.history[state.historyIndex], 0, 0);
        document.getElementById('undoBtn').disabled = state.historyIndex <= 0;
        document.getElementById('redoBtn').disabled = state.historyIndex >= state.history.length - 1;
        sync3D(true);
        drawOverlay();
        syncToLocalStorage();
      }
    };

    document.getElementById('clearCanvasBtn').onclick = () => {
      if (confirm('Clear canvas?')) {
        mainCtx.clearRect(0, 0, 64, 64);
        saveHistoryState();
        sync3D(true);
        drawOverlay();
        syncToLocalStorage();
      }
    };

    let syncThrottle = null;
    function sync3D(immediate = false) {
      const dataUrl = mainCanvas.toDataURL('image/png');
      if (immediate) {
        clearTimeout(syncThrottle);
        syncThrottle = null;
        if (skinViewer) skinViewer.loadSkin(dataUrl);
        if (popupViewer) popupViewer.loadSkin(dataUrl);
        return;
      }
      if (!syncThrottle) {
        syncThrottle = setTimeout(() => {
          if (skinViewer) skinViewer.loadSkin(dataUrl);
          if (popupViewer) popupViewer.loadSkin(dataUrl);
          syncThrottle = null;
        }, 40);
      }
    }

    function setAnimation(animType) {
      if (!skinViewer) return;
      if (animType === 'walk') skinViewer.animation = new skinview3d.WalkingAnimation();
      else if (animType === 'run') skinViewer.animation = new skinview3d.RunningAnimation();
      else if (animType === 'idle') skinViewer.animation = new skinview3d.IdleAnimation();
      else skinViewer.animation = null;
    }

    function setModelShape(shape) {
      if (skinViewer && skinViewer.playerObject) {
        skinViewer.playerObject.skin.modelType = shape;
        skinViewer.loadSkin(mainCanvas.toDataURL('image/png'), { model: shape });
      }
      if (popupViewer && popupViewer.playerObject) {
        popupViewer.playerObject.skin.modelType = shape;
        popupViewer.loadSkin(mainCanvas.toDataURL('image/png'), { model: shape });
      }
      showToast(`Model: ${shape === 'slim' ? 'Alex' : 'Steve'}`);
    }

    function setCameraAngle(angle) {
      if (!skinViewer || !skinViewer.camera) return;
      if (angle === 'front') skinViewer.camera.position.set(0, 0, 42);

    function initPopup3DViewer() {

    function updatePopupCamera() {
      if (!popupViewer) return;
      const { radius, phi, theta } = popupCamSpherical;
      popupViewer.camera.position.x = radius * Math.sin(phi) * Math.sin(theta);
      popupViewer.camera.position.y = radius * Math.cos(phi);
      popupViewer.camera.position.z = radius * Math.sin(phi) * Math.cos(theta);
      popupViewer.camera.lookAt(0, 0, 0);

    function updatePopupLayersVisibility() {
      if (!popupViewer || !popupViewer.playerObject || !popupViewer.playerObject.skin) return;
      const skin = popupViewer.playerObject.skin;
      const showBase = document.getElementById('popupBaseLayerToggle').checked;
      const showOuter = document.getElementById('popupOuterLayerToggle').checked;

      ['head', 'body', 'rightArm', 'leftArm', 'rightLeg', 'leftLeg'].forEach(limb => {
        if (skin[limb]) {

    function setupPopupPaintingInteractions(canvas) {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      function getRaycastUV(e) {
        const rect = canvas.getBoundingClientRect();
        mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, popupViewer.camera);

        const meshes = [];
        popupViewer.playerObject.traverse(child => {
          if (child.isMesh && child.visible) {
            meshes.push(child);
          }
        });

        const hits = raycaster.intersectObjects(meshes, false);
        if (hits.length > 0 && hits[0].uv) {
          const uv = hits[0].uv;
          const px = Math.floor(uv.x * 64);
          const py = Math.floor((1.0 - uv.y) * 64);
          return {
            x: Math.max(0, Math.min(63, px)),
            y: Math.max(0, Math.min(63, py)),
            mesh: hits[0].object
          };
        }
        return null;
      }

      canvas.addEventListener('contextmenu', (e) => e.preventDefault());

      canvas.addEventListener('mousedown', (e) => {
        if (e.button === 2) {
          isPopupOrbiting = true;
          lastPopupMouse = { x: e.clientX, y: e.clientY };
          return;
        }

        if (e.button === 0) {
          const hit = getRaycastUV(e);
          if (hit) {
            is3dPainting = true;
            lastPaintedPixel = { x: hit.x, y: hit.y };

            if (state.tool === 'dropper') {
              const p = mainCtx.getImageData(hit.x, hit.y, 1, 1).data;
              if (p[3] > 0) {
                setColor(rgbToHex(p[0], p[1], p[2]));
                setTool('pencil');
              }
            } else {
              applyPixel(hit.x, hit.y);
              sync3D(true);
              drawOverlay();
            }
          } else {
            isPopupOrbiting = true;
            lastPopupMouse = { x: e.clientX, y: e.clientY };
          }
        }
      });

      window.addEventListener('mousemove', (e) => {
        const isRightHeld = (e.buttons & 2) !== 0;
        const isLeftHeld = (e.buttons & 1) !== 0;

        if (isPopupOrbiting && (isRightHeld || (isLeftHeld && !is3dPainting))) {
          const dx = e.clientX - lastPopupMouse.x;
          const dy = e.clientY - lastPopupMouse.y;
          lastPopupMouse = { x: e.clientX, y: e.clientY };

          popupCamSpherical.theta -= dx * 0.008;
          popupCamSpherical.phi = Math.max(0.05, Math.min(Math.PI - 0.05, popupCamSpherical.phi - dy * 0.008));
          updatePopupCamera();
          return;
        } else if (!isRightHeld && !isLeftHeld) {
          isPopupOrbiting = false;
        }

        if (is3dPainting && isLeftHeld) {
          const hit = getRaycastUV(e);
          if (hit) {
            document.getElementById('popupHoverCoord').textContent = `X: ${hit.x}, Y: ${hit.y}`;
            if (hit.x !== lastPaintedPixel.x || hit.y !== lastPaintedPixel.y) {
              drawLine(lastPaintedPixel.x, lastPaintedPixel.y, hit.x, hit.y);
              lastPaintedPixel = { x: hit.x, y: hit.y };
              sync3D(false);
              drawOverlay();
            }
          }
        } else {
          is3dPainting = false;
          const hit = getRaycastUV(e);
          document.getElementById('popupHoverCoord').textContent = hit ? `X: ${hit.x}, Y: ${hit.y}` : 'None';
        }
      });

      window.addEventListener('mouseup', () => {
        if (is3dPainting) {
          is3dPainting = false;
          lastPaintedPixel = { x: -1, y: -1 };
          saveHistoryState();
          sync3D(true);
          syncToLocalStorage();
        }
        isPopupOrbiting = false;
      });

      canvas.addEventListener('wheel', (e) => {
        e.preventDefault();
        popupCamSpherical.radius = Math.max(16, Math.min(130, popupCamSpherical.radius + e.deltaY * 0.05));
        updatePopupCamera();
      }, { passive: false });
    }

    /* =========================================================

    async function searchAndLoadSkin(username) {
      if (!username || !username.trim()) return;
      username = username.trim();
      showToast(`Loading skin for "${username}"...`);

      // 1. ROUTE 1: Weserv Image CDN + Minotar
      try {
        const res = await fetch(`https://images.weserv.nl/?url=minotar.net/skin/${encodeURIComponent(username)}&output=png`);
        if (res.ok) {
          const blob = await res.blob();
          if (blob.size > 300) {
            const dataUrl = await blobToDataUrl(blob);
            await applyTextureFromUrl(dataUrl);
            showToast(`Loaded: ${username}`);
            return;
          }
        }
      } catch (e) {}

      // 2. ROUTE 2: Weserv Image CDN + MC-Heads
      try {
        const res = await fetch(`https://images.weserv.nl/?url=mc-heads.net/skin/${encodeURIComponent(username)}&output=png`);
        if (res.ok) {
          const blob = await res.blob();
          if (blob.size > 300) {
            const dataUrl = await blobToDataUrl(blob);
            await applyTextureFromUrl(dataUrl);
            showToast(`Loaded: ${username}`);
            return;
          }
        }
      } catch (e) {}

      // 3. ROUTE 3: Direct Minotar
      try {
        const res = await fetch(`https://minotar.net/skin/${encodeURIComponent(username)}`);
        if (res.ok) {
          const blob = await res.blob();
          if (blob.size > 300) {
            const dataUrl = await blobToDataUrl(blob);
            await applyTextureFromUrl(dataUrl);
            showToast(`Loaded: ${username}`);
            return;
          }
        }
      } catch (e) {}

      // 4. ROUTE 4: Ashcon Mojang API
      try {
        const res = await fetch(`https://api.ashcon.app/mojang/v2/user/${encodeURIComponent(username)}`);
        if (res.ok) {
          const json = await res.json();
          if (json.textures && json.textures.skin && json.textures.skin.data) {
            await applyTextureFromUrl('data:image/png;base64,' + json.textures.skin.data);
            showToast(`Loaded: ${json.username || username}`);
            return;
          }
        }
      } catch (e) {}

      showToast(`Player not found: "${username}"`);
    }

    function applyTextureFromUrl(dataUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.onload = () => {
          mainCtx.clearRect(0, 0, 64, 64);
          if (img.naturalHeight === 32) {
            mainCtx.drawImage(img, 0, 0);
            mainCtx.drawImage(mainCanvas, 0, 16, 16, 16, 16, 48, 16, 16);
            mainCtx.drawImage(mainCanvas, 40, 16, 16, 16, 32, 48, 16, 16);
          } else {
            mainCtx.drawImage(img, 0, 0, 64, 64);
          }
          saveHistoryState();
          sync3D(true);
          drawOverlay();
          syncToLocalStorage();
          resolve();
        };
        img.src = dataUrl;
      });
    }

    function getBrowserBatch(count = 20) {
      const batch = [];
      const available = MASSIVE_PLAYER_POOL.filter(n => !browserSeen.has(n.toLowerCase()));
      const shuffled = [...(available.length >= count ? available : MASSIVE_PLAYER_POOL)].sort(() => 0.5 - Math.random());
      
      for (let i = 0; i < Math.min(count, shuffled.length); i++) {
        const name = shuffled[i];
        browserSeen.add(name.toLowerCase());
        browserCardCount++;
        batch.push({
          name: name,
          rank: `#${browserCardCount}`,
          age: (Math.random() * 10 + 1).toFixed(1) + 'd',
          stars: Math.floor(Math.random() * 950 + 20)
        });
      }
      return batch;
    }

            </button>
          </div>
        `;

        card.querySelector('.edit-quick-btn').onclick = () => {
          searchAndLoadSkin(profile.name);
          closeNativeBrowser();
        };

        const starBtn = card.querySelector('.star-btn');
        starBtn.onclick = (e) => {
          e.stopPropagation();
          const nowStarred = StarredManager.toggle(profile);
          starBtn.classList.toggle('is-starred', nowStarred);
          const countSpan = starBtn.querySelector('.star-count');
          let currentVal = parseInt(countSpan.textContent.replace(/,/g, ''), 10);
          countSpan.textContent = (nowStarred ? currentVal + 1 : Math.max(0, currentVal - 1)).toLocaleString();
          showToast(nowStarred ? `Starred ${profile.name}! ★` : `Unstarred ${profile.name}`);
          if (browserActiveFilter === 'starred') {
            loadStarredNativeTab();
          }
        };

        grid.appendChild(card);
      });
    }

    function loadStarredNativeTab() {
      const grid = document.getElementById('nativeSkinGrid');
      grid.innerHTML = '';
      const list = Object.values(StarredManager.getAll());

      if (list.length === 0) {
        grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#7e8696;">No starred skins yet! Click ★ on any card to save it.</div>`;
        return;
      }
      appendNativeCards(list);
    }

    document.getElementById('browserRollBtn').onclick = () => {
      browserActiveFilter = 'all';
      document.getElementById('tabAllSkinsBtn').classList.add('btn-primary');
      document.getElementById('tabStarredSkinsBtn').classList.remove('btn-primary');
      rollNewBrowserSkins();
    };

    document.getElementById('tabAllSkinsBtn').onclick = () => {
      browserActiveFilter = 'all';
      document.getElementById('tabAllSkinsBtn').classList.add('btn-primary');
      document.getElementById('tabStarredSkinsBtn').classList.remove('btn-primary');
      rollNewBrowserSkins();
    };

    document.getElementById('tabStarredSkinsBtn').onclick = () => {
      browserActiveFilter = 'starred';
      document.getElementById('tabStarredSkinsBtn').classList.add('btn-primary');
      document.getElementById('tabAllSkinsBtn').classList.remove('btn-primary');
      loadStarredNativeTab();
    };

    function handleBrowserSearch() {
      const q = document.getElementById('browserSearchInput').value.trim();
      if (!q) return;
      document.getElementById('nativeSkinGrid').innerHTML = '';
      appendNativeCards([{
        name: q,
        rank: '#1',
        age: 'Now',
        stars: 350
      }, ...getBrowserBatch(20)]);
      document.getElementById('browserSearchInput').value = '';
    }

    document.getElementById('browserSearchBtn').onclick = handleBrowserSearch;
    document.getElementById('browserSearchInput').onkeydown = (e) => { if (e.key === 'Enter') handleBrowserSearch(); };

    // Infinite scroll inside browser modal
    document.getElementById('browserViewport').addEventListener('scroll', function() {
      if (browserActiveFilter === 'all' && this.scrollTop + this.clientHeight >= this.scrollHeight - 100) {
        appendNativeCards(getBrowserBatch(12));
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;

      if (e.ctrlKey || e.metaKey) {
        if (e.key.toLowerCase() === 'z') {
          e.preventDefault();
          document.getElementById('undoBtn').click();
        } else if (e.key.toLowerCase() === 'y') {
          e.preventDefault();
          document.getElementById('redoBtn').click();
        }
        return;
      }

      const key = e.key.toLowerCase();
      if (key === 'b') setTool('pencil');
      else if (key === 'e') setTool('eraser');
      else if (key === 'g') setTool('bucket');
      else if (key === 'i') setTool('dropper');
      else if (key === 'n') setTool('noise');
      else if (key === 'l') setTool('lighten');
      else if (key === 'escape') {
        closePopupModal();
        closeNativeBrowser();
      }
    });

    window.addEventListener('resize', () => {
      if (skinViewer && skinViewer.setSize) {
        const c = document.getElementById('skin3d-wrapper');
        skinViewer.setSize(c.clientWidth, c.clientHeight);
      }
      if (popupViewer && popupViewer.setSize) {
        const pc = document.getElementById('popup3dViewport');
        popupViewer.setSize(pc.clientWidth, pc.clientHeight);
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      setZoom(8);
      initPalette();
      const savedSkin = localStorage.getItem('minecraft_active_skin');
      if (savedSkin) {
        applyTextureFromUrl(savedSkin);
      } else {
        initSteveBase();
      }
      init3DDock();
      StarredManager.updateBadges();
    });
  </script>
</body>
</html>
